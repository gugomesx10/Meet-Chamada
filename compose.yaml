services:
  postgres:
    image: postgres:17
    container_name: meet-chamada-postgres

    environment:
      POSTGRES_DB: meet_chamada
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - meet_chamada_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meet_chamada"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  meet_chamada_postgres_data: